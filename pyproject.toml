[project]
name = "armd"
version = "0.1.0"
description = "Auto-Regressive Moving Diffusion Models for Time Series Forecasting (tutorial deps subset)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # torch resolves to the CUDA wheel index on Linux/Windows; macOS falls back to PyPI.
    "torch>=2.0",
    "einops>=0.6",
    "ema-pytorch>=0.2",
    "pyyaml>=6",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "tqdm>=4.64",
    "matplotlib>=3.6",
    "jupyter>=1.0",
    "ipykernel>=6",
    "nbconvert>=7",
]

# PyTorch CUDA 12.4 wheels are used on Linux/Windows; macOS uses the default PyPI torch wheel.
# After changing this file, run: `uv lock` then `uv sync`
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

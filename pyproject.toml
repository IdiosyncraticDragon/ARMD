[project]
name = "armd"
version = "0.1.0"
description = "Auto-Regressive Moving Diffusion Models for Time Series Forecasting (tutorial deps subset)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Resolved from PyTorch CUDA wheel index (see [[tool.uv.index]]), not CPU-only PyPI.
    "torch>=2.0",
    "einops>=0.6",
    "ema-pytorch>=0.2",
    "pyyaml>=6",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "tqdm>=4.64",
    "matplotlib>=3.6",
    "jupyter>=1.0",
    "ipykernel>=6",
    "nbconvert>=7",
]

# GPU-enabled PyTorch: install `torch` from the official CUDA wheel repo (Windows/Linux with NVIDIA driver).
# After changing this file, run: `uv lock` then `uv sync`
# CPU-only fallback: comment out [[tool.uv.index]] + [tool.uv.sources] and use default PyPI `torch`.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

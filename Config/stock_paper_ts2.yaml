# Stock 鈥?align with ARMD paper supplemental (arxiv:2412.09328):
# - 70/10/20 chronological train/val/test on sliding windows (three_split)
# - Adam lr 1e-3, L1 loss, 2000 training iterations, batch 128 (same as other benchmarks in paper)
# - sampling_timesteps chosen from {1..12} via validation in paper; Stock uses 1 in Diffusion-TS-style configs here.
# - Metrics: MSE/MAE on z-score normalized series (StandardScaler); paper averages 10 sampling runs (see main.py).

model:
  target: Models.autoregressive_diffusion.armd.ARMD
  params:
    seq_length: 96
    feature_size: 6
    timesteps: 96
    sampling_timesteps: 2
    loss_type: 'l1'
    beta_schedule: 'cosine'
    w_grad: True

solver:
  base_lr: 1.0e-3
  max_epochs: 2000
  results_folder: ./Checkpoints_stock_paper
  gradient_accumulate_every: 2
  save_cycle: 1800
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8
      three_split: True
      train_ratio: 0.7
      val_ratio: 0.1
      data_root: ./Data/datasets/stock_data.csv
      window: 192
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8
      three_split: True
      train_ratio: 0.7
      val_ratio: 0.1
      data_root: ./Data/datasets/stock_data.csv
      window: 192
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: test
      style: separate
      distribution: geometric

  batch_size: 128
  sample_size: 256
  shuffle: True


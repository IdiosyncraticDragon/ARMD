# Stock — align with ARMD paper supplemental (arxiv:2412.09328):
# - 70/10/20 chronological train/val/test on sliding windows (three_split)
# - Global StandardScaler z-score (norm_on_train: False). NOTE: train-only z-score
#   overshoots badly here because Stock triples in price (test sits ~5.5 sigma above
#   the train mean); per-window RevIN handles that drift instead — see use_revin below.
# - use_revin: True — normalize each window by its own lookback stats, re-applied to
#   the prediction so metrics stay in outer-scaler space.
# - Adam lr 1e-3, L1 loss, 2000 training iterations, batch 128 (same as other benchmarks in paper)
# - sampling_timesteps: paper selects from {1..12} on the validation split; a quick local sweep
#   (same 70/10/20 + L1 + 2000 iters) gave much closer MAE with 2 than with 1 — adjust if you reproduce val search.
# - Metrics: MSE/MAE on z-score normalized series (StandardScaler); paper averages 10 sampling runs (see main.py).

model:
  target: Models.autoregressive_diffusion.armd.ARMD
  params:
    seq_length: 96
    feature_size: 6
    timesteps: 96
    sampling_timesteps: 2
    loss_type: 'l1'
    beta_schedule: 'cosine'
    w_grad: True
    use_revin: True   # per-window RevIN (normalize by lookback stats, undo on output)

solver:
  base_lr: 1.0e-3
  max_epochs: 2000
  results_folder: ./Checkpoints_stock_paper
  gradient_accumulate_every: 2
  save_cycle: 1800
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8
      three_split: True
      train_ratio: 0.7
      val_ratio: 0.1
      data_root: ./Data/datasets/stock_data.csv
      window: 192
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: train
      norm_on_train: False

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8
      three_split: True
      train_ratio: 0.7
      val_ratio: 0.1
      data_root: ./Data/datasets/stock_data.csv
      window: 192
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: test
      style: separate
      distribution: geometric
      norm_on_train: False

  batch_size: 128
  sample_size: 256
  shuffle: True
